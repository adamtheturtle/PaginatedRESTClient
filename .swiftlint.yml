# SwiftLint configuration for PaginatedRESTClient.
# Lints the hand-written sources and tests; the SwiftPM build directory holds
# generated code (e.g. the test entry point) that we never want to lint.

included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  # The package is deliberately a single-file library: the transport, pagination
  # pipeline, and error types are one cohesive unit, and splitting them across
  # files to satisfy a line count would obscure that rather than clarify it.
  - file_length
  # The public client surface and pagination helpers live on one type; splitting
  # for a line budget would scatter the retry/pagination contract.
  - type_body_length
  # Retry and pagination control flow is intentionally explicit rather than
  # factored into many tiny helpers that hide the attempt/cooldown state machine.
  - cyclomatic_complexity

# `walkNextPages` owns visited-URL state, page caps, and emit/dedupe callbacks.
# Bundling those into a context object would hide the `inout` aliasing that keeps
# ordered-prefix emission readable.
function_parameter_count:
  warning: 10
  error: 10

function_body_length:
  warning: 100
  error: 100

identifier_name:
  excluded:
    - id
    - n
    - to
    - of
    - at
    - on
    - by
